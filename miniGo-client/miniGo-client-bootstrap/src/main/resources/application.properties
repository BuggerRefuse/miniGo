spring.application.name=mini-go-client
server.port=8081

spring.config.import=optional:nacos:mini-go-client.yaml?group=DEFAULT_GROUP&refreshEnabled=true

spring.datasource.url=${MINIGO_DB_URL:jdbc:mysql://127.0.0.1:3306/minigo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MINIGO_DB_USERNAME:root}
spring.datasource.password=${MINIGO_DB_PASSWORD:123456Zzsnd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=2s

mybatis-plus.configuration.map-underscore-to-camel-case=true

mini-go.auth.jwt.secret=${MINIGO_JWT_SECRET:minigo-local-development-jwt-secret-change-me-now}
mini-go.auth.jwt.issuer=mini-go-client
mini-go.auth.jwt.access-ttl=15m
mini-go.auth.jwt.refresh-ttl=7d

mini-go.auth.wechat.app-id=${MINIGO_WECHAT_APP_ID:}
mini-go.auth.wechat.app-secret=${MINIGO_WECHAT_APP_SECRET:}
mini-go.auth.wechat.mock-enabled=${MINIGO_WECHAT_MOCK_ENABLED:true}

spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
spring.cloud.nacos.discovery.fail-fast=false

spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.config.group=DEFAULT_GROUP

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

logging.level.org.example=info
