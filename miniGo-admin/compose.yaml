name: minigo-admin

services:
  admin:
    container_name: minigo-admin
    image: minigo-admin:local
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8082"
    environment:
      TZ: Asia/Shanghai
      MINIGO_ADMIN_DB_URL: ${MINIGO_ADMIN_DB_URL:-jdbc:mysql://minigo-mysql:3306/minigo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      MINIGO_DB_USERNAME: ${MINIGO_DB_USERNAME:-root}
      MINIGO_DB_PASSWORD: ${MINIGO_DB_PASSWORD:?MINIGO_DB_PASSWORD must be set}
      REDIS_HOST: ${REDIS_HOST:-minigo-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      MINIGO_JWT_SECRET: ${MINIGO_JWT_SECRET:?MINIGO_JWT_SECRET must be set}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-minigo-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    labels:
      com.minigo.project: mini-go-admin
      com.minigo.component: backend
    networks:
      - minigo-app-net
    restart: unless-stopped

networks:
  minigo-app-net:
    name: minigo-app-net
    external: true
