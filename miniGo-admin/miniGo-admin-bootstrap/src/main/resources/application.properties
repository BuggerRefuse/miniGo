spring.application.name=mini-go-admin
server.port=${SERVER_PORT:8082}

spring.config.import=optional:nacos:mini-go-admin.yaml?group=DEFAULT_GROUP&refreshEnabled=true

spring.datasource.url=${MINIGO_ADMIN_DB_URL:${MINIGO_DB_URL:jdbc:mysql://127.0.0.1:3306/minigo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}}
spring.datasource.username=${MINIGO_DB_USERNAME:root}
spring.datasource.password=${MINIGO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=2s

mybatis-plus.configuration.map-underscore-to-camel-case=true

mini-go.admin.jwt.secret=${MINIGO_JWT_SECRET}
mini-go.admin.jwt.issuer=mini-go-client
mini-go.admin.jwt.access-ttl=15m
mini-go.admin.jwt.refresh-ttl=7d

spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.discovery.ip=${MINIGO_ADMIN_DISCOVERY_IP:}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
spring.cloud.nacos.discovery.fail-fast=false

spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.config.group=DEFAULT_GROUP

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

info.app.name=miniGo-admin
info.app.description=Administrator authentication service

logging.level.org.example=info
