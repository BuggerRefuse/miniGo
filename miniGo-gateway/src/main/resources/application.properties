spring.application.name=mini-go-gateway
server.port=${SERVER_PORT:9000}
management.server.port=${MANAGEMENT_PORT:9091}

spring.config.import=optional:nacos:mini-go-gateway.yaml?group=DEFAULT_GROUP&refreshEnabled=true

spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
spring.cloud.nacos.discovery.fail-fast=false

spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.config.group=DEFAULT_GROUP

mini-go.gateway.jwt.secret=${MINIGO_JWT_SECRET:minigo-local-development-jwt-secret-change-me-now}
mini-go.gateway.jwt.issuer=mini-go-client
mini-go.gateway.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000}

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.gateway.enabled=true

info.app.name=miniGo-gateway
info.app.description=API gateway for miniGo microservices

logging.level.org.example.gateway=info
